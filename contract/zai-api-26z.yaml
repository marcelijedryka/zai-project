openapi: 3.1.0
info:
  title: ZAI 26Z – kontrakt API projektu „Serie pomiarowe”
  version: 2.0.0
  description: |
    Wspólny kontrakt REST API dla projektu z przedmiotu Zaawansowane Aplikacje
    Internetowe (26Z). Każda aplikacja musi implementować wszystkie operacje
    opisane poniżej, bez zmiany ścieżek, nazw pól, kodów odpowiedzi ani sposobu
    uwierzytelniania.

    Wyniki pomiarów trafiają do aplikacji wyłącznie z czujników
    (`POST /api/measurements` z nagłówkiem `X-API-Key`). API nie udostępnia
    modyfikacji ani usuwania pojedynczych wyników; znikają one tylko razem
    z usuwaną serią.

    Wolno dodawać własne pola (np. `unit`, `description`) i własne ścieżki.
    Nie wolno usuwać ani zmieniać znaczenia elementów opisanych w kontrakcie,
    bo od nich zależą testy automatyczne.

    ## Zasady ogólne
    - Wszystkie ścieżki mają prefiks `/api`.
    - Treść żądań i odpowiedzi: `application/json` (UTF-8). Błędy:
      `application/problem+json` zgodnie z RFC 9457.
    - Znaczniki czasu: ISO 8601 ze strefą czasową, np. `2026-10-15T08:30:00Z`.
      Serwer może zwracać czas w dowolnej strefie, ale musi on wskazywać tę samą chwilę.
    - Identyfikatory (`id`) to liczby całkowite albo napisy (np. UUID);
      klient traktuje je jako nieprzezroczyste wartości.
    - Operacje odczytu (GET) na seriach i wynikach są publiczne. Zarządzanie
      seriami i czujnikami wymaga nagłówka `Authorization: Bearer <token>`
      uzyskanego z `/api/auth/login`. Przesyłanie wyników wymaga klucza API
      czujnika w nagłówku `X-API-Key`; token administratora nie wystarcza.
    - Żądanie z nagłówkiem `Accept`, którego nie da się spełnić (np. tylko
      `application/xml`), kończy się kodem 406. Żądanie z treścią w formacie innym
      niż JSON kończy się kodem 415.
    - Błędy walidacji semantycznej (np. wartość spoza przedziału serii, min ≥ max)
      zwracają kod HTTP 422, a błędy składniowe (niepoprawny JSON, brak wymaganego pola,
      zły typ) zwracają 400 lub 422.
servers:
  - url: https://twoja-aplikacja.example.com
    description: Adres wdrożonej aplikacji (podaj własny w formularzu zgłoszenia)

tags:
  - name: system
  - name: auth
  - name: series
  - name: measurements
  - name: sensors
    description: Rejestracja i wyrejestrowanie czujników (administrator).

paths:
  /api/health:
    get:
      tags: [system]
      summary: Sprawdzenie dostępności aplikacji
      description: Używane przez testy do „wybudzenia” aplikacji na darmowym hostingu.
      responses:
        '200':
          description: Aplikacja działa
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /api/auth/login:
    post:
      tags: [auth]
      summary: Logowanie administratora
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Poprawne logowanie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Wylogowanie (unieważnienie tokenu)
      security: [ { bearerAuth: [] } ]
      responses:
        '204': { description: Wylogowano; token przestaje być ważny }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/password:
    put:
      tags: [auth]
      summary: Zmiana hasła zalogowanego administratora
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '204': { description: Hasło zmienione }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Podane bieżące hasło jest niepoprawne
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/series:
    get:
      tags: [series]
      summary: Lista serii
      responses:
        '200':
          description: Wszystkie serie
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Series' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
    post:
      tags: [series]
      summary: Utworzenie serii
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeriesInput' }
      responses:
        '201':
          description: Seria utworzona
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/series/{seriesId}:
    parameters:
      - $ref: '#/components/parameters/SeriesId'
    get:
      tags: [series]
      summary: Odczyt serii
      responses:
        '200':
          description: Seria
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [series]
      summary: Pełna aktualizacja serii
      description: |
        Zastępuje wszystkie edytowalne pola serii. Jeśli nowy przedział
        [minValue, maxValue] nie obejmuje wartości wyników już zapisanych w serii,
        serwer odrzuca zmianę kodem 409.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeriesInput' }
      responses:
        '200':
          description: Seria po aktualizacji
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [series]
      summary: Usunięcie serii wraz ze wszystkimi jej wynikami i przypisanymi czujnikami
      security: [ { bearerAuth: [] } ]
      responses:
        '204': { description: Usunięto }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/measurements:
    get:
      tags: [measurements]
      summary: Wyniki wybranych serii w przedziale czasu
      description: |
        Zwraca wyniki posortowane rosnąco według `timestamp` (lub malejąco dla
        `sort=-timestamp`). Przedział czasu jest domknięty: from ≤ timestamp ≤ to.
      parameters:
        - name: series
          in: query
          description: Lista identyfikatorów serii rozdzielonych przecinkami; brak = wszystkie serie
          schema: { type: string, example: '1,3' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          schema: { type: string, enum: [timestamp, -timestamp], default: timestamp }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
      responses:
        '200':
          description: Lista wyników
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Measurement' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [measurements]
      summary: Przesłanie wyniku przez czujnik
      description: |
        Jedyny sposób zapisu wyników. Wymaga klucza API czujnika w nagłówku
        `X-API-Key`; seria, do której trafia wynik, wynika z klucza. Żądanie
        z samym tokenem administratora kończy się kodem 401.

        Wartość spoza przedziału [minValue, maxValue] serii jest odrzucana
        kodem 422, podobnie jak znacznik czasu późniejszy niż 5 minut od bieżącego
        czasu serwera. Brak pola `timestamp` oznacza bieżący czas serwera;
        znaczniki z przeszłości są dozwolone (np. do przygotowania danych przykładowych).
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeasurementInput' }
      responses:
        '201':
          description: Wynik zapisany
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Measurement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/measurements/{measurementId}:
    parameters:
      - $ref: '#/components/parameters/MeasurementId'
    get:
      tags: [measurements]
      summary: Odczyt wyniku
      description: Wyników nie można modyfikować ani usuwać; metody PUT, PATCH i DELETE zwracają 404 lub 405.
      responses:
        '200':
          description: Wynik
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Measurement' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/sensors:
    get:
      tags: [sensors]
      summary: Lista zarejestrowanych czujników (bez kluczy API)
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Czujniki
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sensor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [sensors]
      summary: Rejestracja czujnika
      description: |
        Klucz API jest zwracany wyłącznie w tej odpowiedzi; serwer przechowuje
        tylko jego skrót i nigdy go ponownie nie ujawnia. Wskazanie nieistniejącej
        serii kończy się kodem 422.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensorInput' }
      responses:
        '201':
          description: Czujnik zarejestrowany
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensorCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/sensors/{sensorId}:
    parameters:
      - name: sensorId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    get:
      tags: [sensors]
      summary: Odczyt czujnika (bez klucza API)
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Czujnik
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sensor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [sensors]
      summary: Wyrejestrowanie czujnika
      description: Klucz czujnika natychmiast przestaje działać; zebrane przez czujnik wyniki pozostają.
      security: [ { bearerAuth: [] } ]
      responses:
        '204': { description: Czujnik wyrejestrowany }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token z `/api/auth/login` (JWT lub token nieprzezroczysty).
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Klucz API czujnika, otrzymany przy jego rejestracji.

  parameters:
    SeriesId:
      name: seriesId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    MeasurementId:
      name: measurementId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }

  headers:
    Location:
      description: Ścieżka nowo utworzonego zasobu, np. `/api/series/12`
      schema: { type: string }

  schemas:
    Id:
      type: [integer, string]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Czas ważności tokenu w sekundach }

    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8 }

    SeriesInput:
      type: object
      required: [name, minValue, maxValue, color]
      description: Warunek dodatkowy – minValue < maxValue (inaczej 422).
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        minValue: { type: number }
        maxValue: { type: number }
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#1f77b4'
        icon:
          type: [string, 'null']
          description: Opcjonalna nazwa ikony lub znacznika punktu na wykresie
        unit:
          type: [string, 'null']
          maxLength: 20
          example: '°C'

    Series:
      allOf:
        - $ref: '#/components/schemas/SeriesInput'
        - type: object
          required: [id]
          properties:
            id: { $ref: '#/components/schemas/Id' }

    MeasurementInput:
      type: object
      description: Seria nie jest podawana w treści – wynika z klucza API czujnika.
      required: [value]
      properties:
        value: { type: number }
        timestamp: { type: string, format: date-time }

    Measurement:
      type: object
      required: [id, seriesId, value, timestamp]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        seriesId: { $ref: '#/components/schemas/Id' }
        sensorId:
          $ref: '#/components/schemas/Id'
          description: Czujnik, który przesłał wynik (opcjonalne)
        value: { type: number }
        timestamp: { type: string, format: date-time }

    SensorInput:
      type: object
      required: [name, seriesId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        seriesId: { $ref: '#/components/schemas/Id' }

    Sensor:
      type: object
      required: [id, name, seriesId]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        seriesId: { $ref: '#/components/schemas/Id' }
        createdAt: { type: string, format: date-time }
        lastMeasurementAt:
          type: [string, 'null']
          format: date-time
          description: Czas ostatniego wyniku przesłanego przez czujnik (opcjonalne)

    SensorCreated:
      allOf:
        - $ref: '#/components/schemas/Sensor'
        - type: object
          required: [apiKey]
          properties:
            apiKey: { type: string, minLength: 32 }

    Problem:
      type: object
      description: Opis błędu zgodny z RFC 9457 (Problem Details for HTTP APIs)
      required: [title, status]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          description: Szczegóły błędów walidacji poszczególnych pól
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

  responses:
    BadRequest:
      description: Niepoprawne żądanie (składnia, typy, brak pól, błędne parametry)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Brak lub niepoprawne uwierzytelnienie
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Zasób nie istnieje
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotAcceptable:
      description: Serwer nie ma reprezentacji zgodnej z nagłówkiem Accept
    Conflict:
      description: Zmiana sprzeczna z bieżącym stanem zasobu
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Treść żądania w nieobsługiwanym formacie
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Dane poprawne składniowo, ale niespełniające reguł (np. wartość spoza przedziału serii)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
