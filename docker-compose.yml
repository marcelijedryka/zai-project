services:
  db:
    image: timescale/timescaledb:2.30.1-pg17
    # A query over all data locks every 7-day chunk (about 52 a year) and its indexes: measured,
    # 1,374 chunks (the floor's worst case) hold ~8,250 locks. Capacity is
    # max_locks_per_transaction x max_connections, so prod (50 connections) needs 512 (plan 11.2).
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432" # dev only: lets host-run pytest reach the DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # F4 error log: WARNING+ JSON lines, readable on the host with `tail -f logs/errors.log`.
      ERROR_LOG_FILE: /var/log/zai/errors.log
    ports:
      - "127.0.0.1:8000:8000" # dev only: not reachable from the network
    volumes:
      - ./backend:/app
      - ./logs:/var/log/zai # gitignored; `make dev` creates it
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
