[project]
name = "zai-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# Only resolve releases at least two weeks old (project rule).
exclude-newer = "2026-09-27T00:00:00Z"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
    "typer>=0.27.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# ../generator: the zai-sensor sources, so the generator can be run against the real app in tests.
pythonpath = [".", "../generator"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async layer runs on greenlets; without this their lines are not recorded.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "SIM", "C4", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# The ported official tests keep the script's compound assertions (`expect(a && b)`).
"tests/contract/**" = ["PT018"]
# The sample series are named "Warsaw – ..." (en dash) in the plan and the seed file.
"tests/integration/test_generator.py" = ["RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic", "scripts"]
mypy_path = "../generator"

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
